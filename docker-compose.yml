version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: shelter-app
    container_name: shelter_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - shelter_vendor:/var/www/vendor
      - ./docker/php/upload.ini:/usr/local/etc/php/conf.d/upload.ini
    networks:
      - shelter-network

  web:
    image: nginx:alpine
    container_name: shelter_web
    restart: unless-stopped
    ports:
      - '8000:80'
    volumes:
      - ./:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - shelter-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: shelter_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shelter
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: shelter_user
    ports:
      - '3306:3306'
    volumes:
      - shelter_db_data:/var/lib/mysql
    networks:
      - shelter-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: shelter_phpmyadmin
    restart: unless-stopped
    ports:
      - '8081:80'
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    networks:
      - shelter-network
    depends_on:
      - db

networks:
  shelter-network:
    driver: bridge

volumes:
  shelter_db_data:
  shelter_vendor:
